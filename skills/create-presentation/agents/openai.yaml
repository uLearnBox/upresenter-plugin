interface:
  display_name: "Create presentation"
  short_description: "Build a designed deck or lesson"
  brand_color: "#6655F0"
  default_prompt: "Create a 10-slide lesson on photosynthesis for grade 6 in my uPresenter account."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "upresenter"
      description: "uPresenter MCP server"
      transport: "streamable_http"
      url: "https://mcp.upresenter.ai/mcp?tools=lean"
