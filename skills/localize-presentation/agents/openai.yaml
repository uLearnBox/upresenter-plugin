interface:
  display_name: "Localize presentation"
  short_description: "Translate a deck into another language"
  brand_color: "#6655F0"
  default_prompt: "Translate my open presentation into Spanish, including quiz questions and feedback."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "upresenter"
      description: "uPresenter MCP server"
      transport: "streamable_http"
      url: "https://mcp.upresenter.ai/mcp?tools=lean"
